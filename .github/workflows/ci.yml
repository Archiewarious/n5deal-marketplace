name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Tests are the cheapest and depend on nothing, so they go first.
      - name: Tests
        run: npm test

      # The build has to run before the typecheck, and the reason is not obvious enough to leave
      # unwritten: Next generates route and layout types into .next/types during a build, and
      # `LayoutProps` is one of them. On a clean checkout tsc has never seen it, so putting the
      # typecheck first fails on a file that is perfectly correct. This is the first thing CI
      # caught, on its first run.
      #
      # The public Supabase variables have to exist, not to be correct: every page renders per
      # request, so nothing here talks to a database. Placeholders keep the real project out of
      # CI while still proving the app compiles.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

      - name: Typecheck
        run: npx tsc --noEmit

# Deliberately not run here: scripts/verify-access.mjs. It signs in as the demo accounts and
# reads the live database, which makes it the most valuable check in the repository and the wrong
# thing to attach to every commit — it would write to the production project from a pull request
# opened by anyone. It is run by hand against a deployment, and its output is in the README.
